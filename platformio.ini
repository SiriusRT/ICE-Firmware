; ICE-Firmware 智能冰柜固件
; ESP32-WROOM-32-N4 + Arduino(FreeRTOS) 分层架构（core 框架无关 / drivers / transport）

[env]
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -DCORE_DEBUG_LEVEL=WARN
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.0
    olikraus/U8g2@^2.35.19
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    knolleary/PubSubClient@^2.8.0
monitor_speed = 115200
upload_speed = 921600

; 主机端单元测试：仅编译 core（lib/core，框架无关），不依赖硬件
[env:native]
platform = native
test_framework = unity
build_src_filter =
    -<*>
build_flags =
lib_deps =
